<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Generador de declaracions d'ús de la IA basat en l'escala IRIS del Marc FECC.">
<title>Generador IRIS · Escala IRIS (Marc FECC)</title>
<style>
  :root{
    --ink:#12313b; --muted:#5b7078; --wash:#f4f8f8; --line:#dbe6e6;
    --teal:#0e7c8a; --teal-dark:#0a5b66;
    --n0:#4e9a54; --n1:#c0392b; --n2:#7c5ca8; --n3:#84961f; --n4:#3d8fb5; --n5:#cf8f1f;
    --n0-bg:#e9f4ea; --n1-bg:#fbeae7; --n2-bg:#f1ecf8; --n3-bg:#f3f5df; --n4-bg:#e6f2f8; --n5-bg:#fcf2dd;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--wash);line-height:1.45;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .shell{width:min(1080px,calc(100% - 28px));margin:0 auto}

  header{display:flex;align-items:center;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
  .mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark))}
  .mark svg{width:26px;height:26px}
  .brand b{display:block;font-size:1rem;letter-spacing:-.01em}
  .brand span{color:var(--muted);font-size:.78rem}
  .langs{margin-left:auto;display:flex;gap:5px}
  .langs button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;
    font-weight:800;font-size:.78rem;color:var(--muted)}
  .langs button.on{background:var(--teal);border-color:var(--teal);color:#fff}

  main{padding:8px 0 40px}
  .grid{display:grid;grid-template-columns:315px minmax(0,1fr);gap:22px;align-items:start}

  /* ------- Insígnia ------- */
  .out{position:sticky;top:12px;display:grid;gap:10px}
  .badge{border:3px solid var(--lv,#9db3b8);border-radius:16px;background:#fff;overflow:hidden;
    box-shadow:0 14px 34px rgba(14,60,70,.12)}
  .badge-head{background:var(--lv,#9db3b8);color:#fff;text-align:center;padding:14px 12px 12px}
  .badge-head .big{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;line-height:1}
  .badge-head .nom{font-weight:700;font-size:.95rem;margin-top:3px}
  .badge-body{padding:11px 14px;text-align:center;display:grid;gap:6px}
  .badge-alg{font-family:Consolas,Menlo,monospace;font-weight:700;font-size:.8rem;color:var(--lv,var(--muted));
    border:1.5px solid var(--lv,var(--line));border-radius:8px;padding:3px 9px;justify-self:center}
  .badge-line{font-size:.8rem;color:var(--muted)}
  .badge-line b{color:var(--ink)}
  .badge-foot{border-top:1px solid var(--line);padding:7px;font-size:.68rem;font-weight:800;
    letter-spacing:.08em;color:var(--muted);text-align:center;text-transform:uppercase}
  .badge-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:.9rem}

  .decl{border:1.5px solid var(--lv,var(--line));border-radius:14px;background:#fff;padding:14px 16px;
    font-family:Georgia,"Times New Roman",serif;font-size:.82rem;line-height:1.55;max-height:295px;overflow:auto}
  .decl h4{margin:0 0 8px;font-size:.86rem}
  .decl p{margin:0 0 8px}
  .decl .sig{color:#4d6167;font-size:.78rem}
  .decl .ph{color:#7d9298;text-align:center;padding:14px 4px;font-family:inherit}

  .outbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .outbtns button{border:0;border-radius:10px;padding:10px 6px;font-weight:800;font-size:.8rem;
    background:var(--teal);color:#fff;transition:transform .12s}
  .outbtns button:hover:not(:disabled){transform:translateY(-1px)}
  .outbtns button:disabled{background:#c3d4d6;cursor:not-allowed}
  .status{min-height:1.2em;font-size:.76rem;font-weight:700;color:#177a52;text-align:center}

  /* ------- Formulari ------- */
  h1{margin:2px 0 4px;font-size:clamp(1.35rem,3vw,1.9rem);letter-spacing:-.025em;line-height:1.1}
  h1 em{font-style:normal;color:var(--teal)}
  .hint{margin:0 0 16px;color:var(--muted);font-size:.9rem}
  h2{margin:20px 0 8px;font-size:.86rem;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-dark)}
  h2 small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}

  .levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lvl{position:relative}
  .lvl input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .lvl .c{display:flex;gap:9px;align-items:center;border:1.5px solid var(--line);border-left:5px solid var(--lv);
    border-radius:11px;background:#fff;padding:8px 10px;transition:all .13s;min-height:56px}
  .lvl:hover .c{border-color:#9fbcc0;border-left-color:var(--lv)}
  .lvl input:checked + .c{border-color:var(--lv);background:var(--lv-bg);box-shadow:0 5px 14px rgba(14,60,70,.10)}
  .lvl input:focus-visible + .c{outline:3px solid rgba(14,124,138,.4);outline-offset:2px}
  .lvl .n{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    color:#fff;font-weight:800;background:var(--lv)}
  .lvl b{display:block;font-size:.82rem;line-height:1.15}
  .lvl small{display:block;color:var(--muted);font-size:.72rem;line-height:1.25;margin-top:1px}
  .resum{margin:8px 0 0;font-size:.8rem;color:#28444d;border-left:4px solid var(--lv,var(--teal));
    background:var(--lv-bg,#eef6f7);border-radius:8px;padding:8px 11px;display:none}
  .resum.show{display:block}

  .helpLink{border:0;background:none;color:var(--teal-dark);font-weight:700;font-size:.8rem;
    text-decoration:underline;padding:0;margin-top:8px}
  .wizard{border:1.5px dashed #b9d3d6;border-radius:12px;padding:13px;background:#f7fbfb;margin-top:9px}
  .wizard p{margin:0 0 9px;font-weight:700;font-size:.86rem}
  .wizard .opts{display:grid;gap:6px}
  .wizard .opts button{text-align:left;border:1.5px solid var(--line);border-radius:10px;background:#fff;
    padding:8px 11px;font-size:.82rem}
  .wizard .opts button:hover{border-color:var(--teal);background:#eef6f7}
  .wizard .opts button small{display:block;color:var(--muted);font-size:.74rem}

  .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chk{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;
    background:#fff;padding:8px 10px;font-size:.8rem;transition:all .13s}
  .chk:hover{border-color:#9fbcc0}
  .chk:has(input:checked){border-color:var(--teal);background:#eef6f7}
  .chk input{accent-color:var(--teal);margin:0;flex:0 0 auto}
  .other{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:.8rem;font-weight:700}
  .other input{flex:1;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:7px 10px;
    font-weight:400;outline:none}
  .other input:focus{border-color:var(--teal)}

  details.det{border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-top:18px}
  details.det summary{cursor:pointer;font-weight:800;font-size:.82rem;padding:10px 13px;color:var(--teal-dark);
    letter-spacing:.04em;text-transform:uppercase}
  .det-in{padding:2px 13px 13px;display:grid;gap:10px}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{position:relative}
  .pill input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .pill span{display:inline-block;padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;font-size:.78rem;font-weight:600}
  .pill input:checked + span{border-color:var(--teal);background:var(--teal);color:#fff}
  .fld{display:grid;gap:4px;font-weight:700;font-size:.78rem}
  .fld input{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;
    font-weight:400;outline:none}
  .fld input:focus{border-color:var(--teal)}

  .alerts{display:grid;gap:6px;margin-top:14px}
  .alert{border-radius:10px;padding:8px 11px;font-size:.78rem;border:1.5px solid}
  .alert.warn{border-color:#ecd6a4;background:#fdf6e7;color:#6d4a06}
  .alert.info{border-color:#bcd9dd;background:#eef6f7;color:#15505a}

  .reset{border:0;background:none;color:#a33;font-weight:700;font-size:.78rem;text-decoration:underline;
    padding:0;margin-top:16px}

  footer{padding:14px 0 32px;color:var(--muted);font-size:.72rem;text-align:center;line-height:1.6;
    border-top:1px solid var(--line)}
  footer b{color:var(--ink)}

  .viewer-only{display:none}
  body.viewer .form-col{display:none}
  body.viewer .viewer-only{display:block}
  body.viewer .grid{grid-template-columns:minmax(0,420px);justify-content:center}
  body.viewer .decl{max-height:none}

  @media (max-width:820px){
    .grid{grid-template-columns:1fr}
    .out{position:static;order:2}
    .form-col{order:1}
    .levels,.checks{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff}
    header,.form-col,.outbtns,.status,footer,.badge,.viewer-only{display:none !important}
    .shell,.grid,.out{display:block;width:100%;position:static}
    .decl{border:1.5px solid #999;max-height:none;overflow:visible;font-size:1rem;padding:24px}
  }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">

          <line x1="4" y1="20" x2="10" y2="20"/><line x1="30" y1="20" x2="36" y2="20"/>
          <line x1="8.7" y1="8.7" x2="12.9" y2="12.9"/><line x1="27.1" y1="27.1" x2="31.3" y2="31.3"/>
          <line x1="8.7" y1="31.3" x2="12.9" y2="27.1"/><line x1="27.1" y1="12.9" x2="31.3" y2="8.7"/>
        </g>
      </svg>
    </div>
    <div class="brand"><b>Generador IRIS</b><span data-i18n="brandSub"></span></div>
    <div class="langs" role="group" aria-label="Idioma">
      <button type="button" data-lang="ca">CA</button>
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <div class="grid">

      <!-- ========= SORTIDA ========= -->
      <div class="out">
        <div class="badge" id="badge">
          <div class="badge-empty" id="badgeEmpty" data-i18n="badgeEmpty"></div>
          <div id="badgeFull" hidden>
            <div class="badge-head">
              <div class="big" id="bLvl">IRIS-0</div>
              <div class="nom" id="bNom"></div>
            </div>
            <div class="badge-body">
              <span class="badge-alg" id="bAlg"></span>
              <div class="badge-line" id="bTitle" hidden></div>
              <div class="badge-line" id="bAuthor" hidden></div>
              <div class="badge-line"><span data-i18n="badgeDate"></span>: <b id="bDate"></b></div>
            </div>
            <div class="badge-foot">Escala IRIS · Marc FECC</div>
          </div>
        </div>

        <div class="decl" id="decl"><div class="ph" data-i18n="declPh"></div></div>

        <div class="outbtns">
          <button type="button" id="btnPng" disabled>PNG</button>
          <button type="button" id="btnTxt" disabled data-i18n="btnTxt"></button>
          <button type="button" id="btnUrl" disabled data-i18n="btnUrl"></button>
          <button type="button" id="btnPrint" disabled data-i18n="btnPrint"></button>
        </div>
        <div class="status" id="status" role="status"></div>
        <div class="viewer-only" style="text-align:center">
          <button type="button" class="helpLink" id="viewerNew" data-i18n="viewerNew"></button>
        </div>
      </div>

      <!-- ========= FORMULARI ========= -->
      <div class="form-col">
        <h1 id="h1"></h1>
        <p class="hint" data-i18n="hint"></p>

        <h2 data-i18n="secLevel"></h2>
        <div class="levels" id="levels" role="radiogroup"></div>
        <p class="resum" id="resum"></p>
        <button type="button" class="helpLink" id="helpBtn" data-i18n="helpMe"></button>
        <div class="wizard" id="wizard" hidden></div>

        <div id="aiBlocks">
          <h2 data-i18n="secTasks"></h2>
          <div class="checks" id="tasks"></div>
          <div class="other"><span data-i18n="otherLabel"></span><input type="text" id="otherUse"></div>

          <h2 data-i18n="secGuar"></h2>
          <div class="checks" id="guars"></div>
        </div>

        <details class="det">
          <summary data-i18n="secDetails"></summary>
          <div class="det-in">
            <div class="pills" id="profiles" role="radiogroup"></div>
            <label class="fld"><span data-i18n="lblTitle"></span><input type="text" id="wTitle"></label>
            <label class="fld"><span data-i18n="lblName"></span><input type="text" id="wName"></label>
            <label class="fld"><span data-i18n="lblTool"></span><input type="text" id="wTool" placeholder="ChatGPT, Claude, Gemini…"></label>
          </div>
        </details>

        <div class="alerts" id="alerts"></div>
        <button type="button" class="reset" id="resetBtn" data-i18n="reset"></button>
      </div>

    </div>
  </main>

  <footer>
    <b>Escala IRIS</b> · <span data-i18n="foot1"></span><br>
    <span data-i18n="foot2"></span><br>
    <span data-i18n="footPriv"></span>
  </footer>
</div>

/* ================================================================
   ESTAT I UTILITATS
   ================================================================ */
let LANG = "ca";
let viewerMode = false;
let currentText = "";
const $ = id => document.getElementById(id);
const T = () => I18N[LANG];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

qrcode.stringToBytes = s => Array.from(new TextEncoder().encode(s));
function makeQR(text){
  for (const e of ["M","L"]){
    try { const q = qrcode(0,e); q.addData(text,"Byte"); q.make(); return q; } catch(_){}
  }
  return null;
}
function b64uEncode(s){
  let b=""; new TextEncoder().encode(s).forEach(v=>b+=String.fromCharCode(v));
  return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64uDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
}
function todayStr(){
  return new Date().toLocaleDateString(LANG==="en"?"en-GB":LANG==="es"?"es-ES":"ca-ES");
}
function monthYear(){
  return new Intl.DateTimeFormat(LANG==="en"?"en-GB":LANG==="es"?"es-ES":"ca-ES",
    {month:"long",year:"numeric"}).format(new Date());
}
function flash(msg){ $("status").textContent = msg; clearTimeout(flash.t); flash.t=setTimeout(()=>$("status").textContent="",4000); }

/* ================================================================
   CONSTRUCCIÓ I RENDERITZACIÓ (re-renderitzable per idioma)
   ================================================================ */
function buildStatic(){
  $("levels").innerHTML = [0,1,2,3,4,5].map(n=>`
    <label class="lvl" style="--lv:${LEVEL_HEX[n]};--lv-bg:${LEVEL_HEX[n]}22">
      <input type="radio" name="level" value="${n}">
      <span class="c"><span class="n">${n}</span>
        <span><b data-lvl-nom="${n}"></b><small data-lvl-d="${n}"></small></span>
      </span>
    </label>`).join("");
  $("tasks").innerHTML = T().tasks.map(t=>`
    <label class="chk"><input type="checkbox" id="${t.id}" data-min="${t.min}"><span data-task="${t.id}"></span></label>`).join("");
  $("guars").innerHTML = T().guars.map(g=>`
    <label class="chk"><input type="checkbox" id="${g.id}"><span data-guar="${g.id}"></span></label>`).join("");
  $("profiles").innerHTML = T().profiles.map(p=>`
    <label class="pill"><input type="radio" name="profile" value="${p.id}"><span data-prof="${p.id}"></span></label>`).join("");
}

function applyLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  const t = T();
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n] || ""; });
  $("h1").innerHTML = t.h1;
  [0,1,2,3,4,5].forEach(n=>{
    const nom = document.querySelector(`[data-lvl-nom="${n}"]`);
    const d = document.querySelector(`[data-lvl-d="${n}"]`);
    if (nom) nom.textContent = t.levels[n].nom;
    if (d) d.textContent = t.levels[n].d;
  });
  t.tasks.forEach(x=>{ const el=document.querySelector(`[data-task="${x.id}"]`); if(el) el.textContent=x.l; });
  t.guars.forEach(x=>{ const el=document.querySelector(`[data-guar="${x.id}"]`); if(el) el.textContent=x.l; });
  t.profiles.forEach(x=>{ const el=document.querySelector(`[data-prof="${x.id}"]`); if(el) el.textContent=x.l; });
  $("wizard").hidden = true;
  update();
}

/* ================================================================
   LECTURA DE L'ESTAT
   ================================================================ */
function readState(){
  const lv = document.querySelector('input[name="level"]:checked');
  const t = T();
  return {
    level: lv ? +lv.value : null,
    profile: (document.querySelector('input[name="profile"]:checked')||{}).value || "",
    title: $("wTitle").value.trim(),
    name: $("wName").value.trim(),
    tool: $("wTool").value.trim(),
    tasks: t.tasks.filter(x=>$(x.id) && $(x.id).checked),
    other: $("otherUse").value.trim(),
    guars: t.guars.filter(x=>$(x.id) && $(x.id).checked)
  };
}

/* ================================================================
   DECLARACIÓ
   ================================================================ */
function buildText(st){
  const t = T();
  const title = st.title ? ` «${st.title}»` : "";
  const P = [];
  if (st.level === 0){
    P.push(t.n0a(title));
    P.push(t.n0b);
  } else {
    P.push(t.p1(title, st.tool));
    const usos = [...st.tasks.map(x=>x.p), ...(st.other?[st.other]:[])];
    P.push(t.p2(st.level, t.levels[st.level].nom, usos.length ? t.join(usos) : "") + " " + t.proc[st.level]);
    if (st.guars.length) P.push(t.guarIntro(t.join(st.guars.map(x=>x.p))));
    P.push(st.level>=4 ? t.resp[st.level] : t.resp.low);
  }
  const prof = t.profiles.find(p=>p.id===st.profile);
  const sig = [st.name, prof?prof.decl:"", monthYear()].filter(Boolean).join(" · ");
  return { heading: t.heading, paragraphs: P, signature: sig };
}
function asText(d){
  return `${d.heading.toUpperCase()}\n\n${d.paragraphs.join("\n\n")}${d.signature?`\n\n— ${d.signature}`:""}`;
}

/* ================================================================
   ALERTES
   ================================================================ */
function computeAlerts(st){
  const t = T(), A = [];
  if (st.level === null) return A;
  if (st.level === 0 && (st.tasks.length || st.other || st.tool))
    A.push({k:"warn", m:t.alerts.n0});
  if (st.level > 0){
    const above = st.tasks.filter(x=>x.min > st.level);
    if (above.length) A.push({k:"warn", m:t.alerts.above(above.map(x=>x.l.toLowerCase()).join(", "))});
    if (st.level === 3 && !$("g1").checked) A.push({k:"info", m:t.alerts.verif});
  }
  if ((st.profile==="eso"||st.profile==="batx") && st.level===5) A.push({k:"info", m:t.alerts.asp});
  if (st.profile==="familia" && st.level>=3) A.push({k:"info", m:t.alerts.fam});
  return A;
}

/* ================================================================
   ACTUALITZACIÓ GLOBAL
   ================================================================ */
function update(){
  if (viewerMode){ renderViewer(); return; }
  const st = readState();
  const t = T();
  const has = st.level !== null;
  const hex = has ? LEVEL_HEX[st.level] : null;

  $("aiBlocks").style.display = st.level === 0 ? "none" : "";

  /* Insígnia */
  const badge = $("badge");
  $("badgeEmpty").hidden = has;
  $("badgeFull").hidden = !has;
  if (has){
    badge.style.setProperty("--lv", hex);
    $("bLvl").textContent = "IRIS-" + st.level;
    $("bNom").textContent = t.levels[st.level].nom;
    $("bAlg").textContent = ALG[st.level];
    $("bTitle").hidden = !st.title; $("bTitle").innerHTML = st.title ? `<b>${esc(st.title)}</b>` : "";
    $("bAuthor").hidden = !st.name; $("bAuthor").textContent = st.name;
    $("bDate").textContent = todayStr();
  } else badge.style.removeProperty("--lv");

  /* Resum del nivell */
  const resum = $("resum");
  if (has){
    resum.classList.add("show");
    resum.style.setProperty("--lv", hex);
    resum.style.setProperty("--lv-bg", hex + "22");
    resum.textContent = t.levels[st.level].r;
  } else resum.classList.remove("show");

  /* Alertes */
  $("alerts").innerHTML = computeAlerts(st).map(a=>`<div class="alert ${a.k}">${a.m}</div>`).join("");

  /* Declaració */
  const declBox = $("decl");
  if (has){
    const d = buildText(st);
    currentText = asText(d);
    declBox.style.setProperty("--lv", hex);
    declBox.innerHTML = `<h4>${esc(d.heading)}</h4>` +
      d.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("") +
      (d.signature?`<p class="sig">— ${esc(d.signature)}</p>`:"");
  } else {
    currentText = "";
    declBox.style.removeProperty("--lv");
    declBox.innerHTML = `<div class="ph">${esc(t.declPh)}</div>`;
  }
  ["btnPng","btnTxt","btnUrl","btnPrint"].forEach(id=>$(id).disabled = !has);
}

/* ================================================================
   ASSISTENT DE NIVELL
   ================================================================ */
function wizardStep(step){
  const w = $("wizard"), z = T().wizard;
  w.hidden = false;
  const opts = (arr, handler) => `<div class="opts">${arr.map((o,i)=>`<button type="button" data-i="${i}">${o}</button>`).join("")}</div>`;
  if (step === 1){
    w.innerHTML = `<p>${z.q1}</p>` + opts(z.q1a);
    w.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      +b.dataset.i === 0 ? wizardVerdict(0) : wizardStep(2);
    }));
  } else if (step === 2){
    w.innerHTML = `<p>${z.q2}</p>` + opts(z.q2a);
    w.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      +b.dataset.i === 0 ? wizardVerdict(1) : wizardStep(3);
    }));
  } else {
    w.innerHTML = `<p>${z.q3}</p>` + opts(z.q3a);
    w.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      wizardVerdict([2,3,4,5][+b.dataset.i]);
    }));
  }
}
function wizardVerdict(level){
  const w = $("wizard"), z = T().wizard, t = T();
  w.innerHTML = `<p style="color:${LEVEL_HEX[level]}">${z.verdict(level)} — <b>${t.levels[level].nom}</b></p>
    <div class="opts">
      <button type="button" id="wzApply">${z.apply}</button>
      <button type="button" id="wzAgain">${z.again}</button>
    </div>`;
  $("wzApply").addEventListener("click",()=>{
    document.querySelector(`input[name="level"][value="${level}"]`).checked = true;
    w.hidden = true; update();
  });
  $("wzAgain").addEventListener("click",()=>wizardStep(1));
}

/* ================================================================
   SEGELL PNG (insígnia vertical amb QR)
   ================================================================ */
function drawBadgePNG(st, level, heading){
  const t = T(), hex = LEVEL_HEX[level];
  const FONT = '"Segoe UI",Arial,sans-serif';
  const url = (URL_PUBLICA_DEL_GENERADOR||"").trim();
  const payload = url ? url.split("#")[0] + "#d=" + b64uEncode(currentText) : currentText;
  const qr = makeQR(payload);
  if (!qr){ flash(t.tooLong); return null; }

  const W = 560;
  const meas = document.createElement("canvas").getContext("2d");
  meas.font = "600 26px " + FONT;
  const titleLines = st.title ? wrapT(meas, "«"+st.title+"»", W-90).slice(0,2) : [];
  const n = qr.getModuleCount();
  const mod = Math.max(3, Math.floor(380/n)), qsz = mod*n;
  let H = 196 + 62 + (titleLines.length?titleLines.length*34+8:0) + (st.name?34:0) + 40 + qsz + 26 + 44 + 56;
  const cv = document.createElement("canvas");
  cv.width = W*2; cv.height = H*2;
  const x = cv.getContext("2d"); x.scale(2,2);

  rr(x,3,3,W-6,H-6,24); x.fillStyle="#fff"; x.fill();
  x.lineWidth=6; x.strokeStyle=hex; x.stroke();
  x.save(); rr(x,3,3,W-6,H-6,24); x.clip();
  x.fillStyle = hex; x.fillRect(3,3,W-6,196); x.restore();

  x.textAlign="center"; x.fillStyle="#fff";
  x.font="800 92px "+FONT; x.fillText("IRIS-"+level, W/2, 112);
  x.font="700 30px "+FONT;
  wrapT(x, t.levels[level].nom, W-70).slice(0,2).forEach((ln,i)=>x.fillText(ln, W/2, 152+i*34));

  let yy = 196 + 44;
  x.font="700 26px Consolas,Menlo,monospace";
  const wAlg = x.measureText(ALG[level]).width + 40;
  rr(x, W/2-wAlg/2, yy-28, wAlg, 42, 10);
  x.fillStyle = hex+"22"; x.fill();
  x.fillStyle = hex; x.fillText(ALG[level], W/2, yy);
  yy += 40;
  x.fillStyle="#12313b";
  if (titleLines.length){
    x.font="600 26px "+FONT;
    titleLines.forEach(ln=>{ x.fillText(ln, W/2, yy); yy += 34; });
    yy += 8;
  }
  if (st.name){ x.font="400 24px "+FONT; x.fillStyle="#5b7078"; x.fillText(st.name, W/2, yy); yy += 34; }
  x.font="400 22px "+FONT; x.fillStyle="#5b7078";
  x.fillText(t.badgeDate + ": " + todayStr(), W/2, yy); yy += 26;

  const qx = Math.floor((W-qsz)/2), qy = yy + 8;
  x.fillStyle="#12313b";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++)
    if (qr.isDark(r,c)) x.fillRect(qx+c*mod, qy+r*mod, mod, mod);
  yy = qy + qsz + 30;
  x.font="600 20px "+FONT; x.fillStyle="#5b7078";
  wrapT(x, t.badgeScan, W-80).slice(0,2).forEach((ln,i)=>x.fillText(ln, W/2, yy+i*26));

  x.font="800 20px "+FONT; x.fillStyle="#8ea6ab";
  x.fillText("ESCALA IRIS · MARC FECC", W/2, H-22);
  return cv;
}
function rr(x,cx,cy,w,h,r){
  x.beginPath(); x.moveTo(cx+r,cy); x.arcTo(cx+w,cy,cx+w,cy+h,r); x.arcTo(cx+w,cy+h,cx,cy+h,r);
  x.arcTo(cx,cy+h,cx,cy,r); x.arcTo(cx,cy,cx+w,cy,r); x.closePath();
}
function wrapT(x,text,maxW){
  const words = String(text).split(" "), lines = []; let cur = "";
  for (const w of words){
    const s = cur ? cur+" "+w : w;
    if (x.measureText(s).width > maxW && cur){ lines.push(cur); cur = w; } else cur = s;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ================================================================
   BOTONS DE SORTIDA
   ================================================================ */
$("btnTxt").addEventListener("click", async ()=>{
  if (!currentText) return;
  try { await navigator.clipboard.writeText(currentText); flash(T().copied); }
  catch(_){ flash("Ctrl+C"); }
});
$("btnUrl").addEventListener("click", async ()=>{
  if (!currentText) return;
  const url = (URL_PUBLICA_DEL_GENERADOR||"").trim();
  const link = (url || location.href.split("#")[0]) + "#d=" + b64uEncode(currentText);
  try { await navigator.clipboard.writeText(link); flash(T().urlOk); }
  catch(_){ flash("Ctrl+C"); }
});
$("btnPrint").addEventListener("click", ()=>window.print());
$("btnPng").addEventListener("click", ()=>{
  if (!currentText) return;
  const st = viewerMode ? viewerState : readState();
  const level = viewerMode ? viewerState.level : st.level;
  if (level === null) return;
  try {
    const cv = drawBadgePNG(st, level);
    if (!cv) return;
    cv.toBlob(b=>{
      const u = URL.createObjectURL(b);
      const a = document.createElement("a");
      a.href = u; a.download = `iris-${level}.png`; a.click();
      URL.revokeObjectURL(u);
    });
    flash(T().pngOk);
  } catch(_){ flash(T().cantPng); }
});
$("resetBtn").addEventListener("click", ()=>{
  document.querySelectorAll("input").forEach(i=>{
    if (i.type==="checkbox"||i.type==="radio") i.checked = false; else i.value = "";
  });
  $("wizard").hidden = true;
  update();
});
$("helpBtn").addEventListener("click", ()=>{
  const w = $("wizard");
  if (w.hidden) wizardStep(1); else w.hidden = true;
});
document.querySelectorAll(".langs button").forEach(b=>
  b.addEventListener("click", ()=>{ buildLangSafe(b.dataset.lang); }));

/* Canvi d'idioma preservant l'estat del formulari */
function buildLangSafe(lang){
  const keep = {
    level: (document.querySelector('input[name="level"]:checked')||{}).value,
    profile: (document.querySelector('input[name="profile"]:checked')||{}).value,
    checks: Array.from(document.querySelectorAll('.checks input:checked')).map(i=>i.id),
    title: $("wTitle").value, name: $("wName").value, tool: $("wTool").value, other: $("otherUse").value
  };
  LANG = lang;
  buildStatic();
  if (keep.level !== undefined && keep.level !== null && keep.level !== "")
    { const el = document.querySelector(`input[name="level"][value="${keep.level}"]`); if (el) el.checked = true; }
  if (keep.profile){ const el = document.querySelector(`input[name="profile"][value="${keep.profile}"]`); if (el) el.checked = true; }
  keep.checks.forEach(id=>{ const el = $(id); if (el) el.checked = true; });
  $("wTitle").value = keep.title; $("wName").value = keep.name;
  $("wTool").value = keep.tool; $("otherUse").value = keep.other;
  applyLang(lang);
}

document.addEventListener("input", e=>{ if (e.target.closest(".form-col")) update(); });
document.addEventListener("change", e=>{ if (e.target.closest(".form-col")) update(); });

/* ================================================================
   MODE VISOR (#d=...)
   ================================================================ */
let viewerState = { level:null, title:"", name:"" };
function renderViewer(){
  const t = T();
  const m = currentText.match(/IRIS-([0-5])/);
  const level = m ? +m[1] : null;
  viewerState.level = level;
  const hex = level!==null ? LEVEL_HEX[level] : null;
  const blocks = currentText.split("\n\n").map(s=>s.trim()).filter(Boolean);
  let heading = t.heading;
  if (blocks.length && blocks[0].length < 130 && /IRIS/.test(blocks[0])) heading = blocks.shift();
  let sig = "";
  if (blocks.length && blocks[blocks.length-1].startsWith("— ")) sig = blocks.pop().slice(2);

  $("badgeEmpty").hidden = level!==null;
  $("badgeFull").hidden = level===null;
  if (level!==null){
    $("badge").style.setProperty("--lv", hex);
    $("bLvl").textContent = "IRIS-"+level;
    $("bNom").textContent = t.levels[level].nom;
    $("bAlg").textContent = ALG[level];
    $("bTitle").hidden = true; $("bAuthor").hidden = !sig;
    $("bAuthor").textContent = sig;
    $("bDate").textContent = todayStr();
    $("decl").style.setProperty("--lv", hex);
  }
  $("decl").innerHTML = `<h4>${esc(heading)}</h4>` +
    blocks.map(p=>`<p>${esc(p)}</p>`).join("") +
    (sig?`<p class="sig">— ${esc(sig)}</p>`:"");
  ["btnTxt","btnPrint","btnPng"].forEach(id=>$(id).disabled=false);
  $("btnUrl").disabled = false;
  flash(t.viewerNote);
}
$("viewerNew").addEventListener("click", ()=>{ location.hash = ""; location.reload(); });

/* ================================================================
   ARRENCADA
   ================================================================ */
buildStatic();
applyLang("ca");
if (location.hash.startsWith("#d=")){
  try {
    currentText = b64uDecode(location.hash.slice(3));
    viewerMode = true;
    document.body.classList.add("viewer");
    renderViewer();
  } catch(_){ viewerMode = false; document.body.classList.remove("viewer"); }
}
